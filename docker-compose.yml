services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: ferzan_postgres

    environment:
      POSTGRES_DB: ferzan_db
      POSTGRES_USER: ferzan_user
      POSTGRES_PASSWORD: ferzan_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ferzan_user -d ferzan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
